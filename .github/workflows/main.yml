name: Windows 11 RDP
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Install Ngrok
      run: |
        choco install ngrok -y
        
    - name: Configure and Start TCP Tunnel
      run: |
        $config = @"
        version: "3"
        agent:
          authtoken: "${{ secrets.NGORK_AUTH_TOKEN }}"
        tunnels:
          rdp:
            proto: tcp
            addr: 3389
        "@
        Set-Content -Path "ngrok.yml" -Value $config
        Start-Process ngrok -ArgumentList "start --config=ngrok.yml rdp --region us"
        Start-Sleep -Seconds 10
        
    - name: Configure Windows User and RDP
      run: |
        $Password = ConvertTo-SecureString "RdpPassword123!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $Password
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        
    - name: Keep Alive
      run: |
        $timeout = (Get-Date).AddHours(5)
        while ((Get-Date) -lt $timeout) {
            Start-Sleep -Seconds 30
        }


